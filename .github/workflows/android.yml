name: NoorTools Android

on:
  push:
    branches: [phase-3f, phase-3g]
  pull_request:
    branches: [main, phase-3f, phase-3g]

permissions:
  contents: read

concurrency:
  group: noortools-android-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Prepare Android project
        run: node -e "import('./scripts/prepare-android.mjs')"
      - name: Build debug APK
        run: cd android && timeout --signal=TERM --kill-after=15s 600s ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Build preview APK
        run: cd android && timeout --signal=TERM --kill-after=15s 600s ./gradlew assemblePreview --no-daemon --stacktrace
      - name: Build release APK
        run: cd android && timeout --signal=TERM --kill-after=15s 600s ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Build release AAB
        run: cd android && timeout --signal=TERM --kill-after=15s 600s ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noortools-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/preview/app-preview.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Prepare Android project
        run: node -e "import('./scripts/prepare-android.mjs')"
      - name: Build debug APK
        run: cd android && timeout --signal=TERM --kill-after=15s 600s ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-noortools-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator route / viewport / navigation UI QA
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          ANDROID_QA_OUT: /tmp/noortools-ui-qa
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 5
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none -accel on
          emulator-boot-timeout: 600
          disable-linux-hw-accel: auto
          disable-animations: true
          pre-emulator-launch-script: |
            set -eu
            test -r /dev/kvm
            test -w /dev/kvm
          script: |
            set -eu
            mkdir -p /tmp/noortools-ui-qa
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            timeout 600s node scripts/android-ui-smoke.mjs
      - name: Capture final Android logs
        if: ${{ always() }}
        run: |
          mkdir -p /tmp/noortools-ui-qa
          adb -s emulator-5554 logcat -d -t 1200 > /tmp/noortools-ui-qa/runner-logcat.txt 2>&1 || true
      - name: Upload Android UI QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: noortools-android-ui-qa-${{ github.sha }}
          path: /tmp/noortools-ui-qa/
          if-no-files-found: warn
