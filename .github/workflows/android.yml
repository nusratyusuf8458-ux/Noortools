name: NoorTools Android

on:
  push:
    branches: [phase-3f, phase-3g, phase-3g-ui-stability]
  pull_request:
    branches: [main, phase-3f, phase-3g]

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Prepare Android project
        run: node -e "import('./scripts/prepare-android.mjs')"
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Build preview APK
        run: cd android && ./gradlew assemblePreview --no-daemon --stacktrace
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noortools-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/preview/app-preview.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Prepare Android project
        run: node -e "import('./scripts/prepare-android.mjs')"
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Emulator route / viewport / navigation UI QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -eu
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.noortools.mobile/.MainActivity
            for i in $(seq 1 30); do
              if adb shell pidof com.noortools.mobile >/dev/null 2>&1; then break; fi
              sleep 2
            done
            if ! adb shell pidof com.noortools.mobile >/dev/null 2>&1; then
              echo 'APP_PROCESS_MISSING_AFTER_BOUNDED_START'
              adb shell dumpsys activity activities | grep -A 12 -B 4 'com.noortools.mobile' || true
              adb logcat -d -b crash || true
              adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION|AndroidRuntime|com.noortools.mobile|chromium|Capacitor' | tail -n 300 || true
              exit 1
            fi
            adb shell dumpsys package com.noortools.mobile | grep -E 'versionName=0.1.0|versionCode=1'
            adb shell appops set com.noortools.mobile ACCESS_FINE_LOCATION deny
            python3 scripts/android-ui-qa.py || {
              echo 'ANDROID_UI_QA_FAILED'
              adb logcat -d -b crash || true
              adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION|AndroidRuntime|com.noortools.mobile|chromium|Capacitor' | tail -n 300 || true
              exit 1
            }
      - name: Upload Android UI QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: noortools-android-ui-qa-${{ github.sha }}
          path: /tmp/noortools-ui-qa/
          if-no-files-found: warn