name: NoorTools CI

on:
  push:
    branches: [main, phase-1, phase-2]
  pull_request:
    branches: [main, phase-1, phase-2]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint / static type safety
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build
